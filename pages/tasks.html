<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tasks.css">
</head>

<body>
    <aside class="sidebar">
        <a href="/dashbaord.html">Dashboard</a>
        <a href="/pages/tasks.html" class="active">Tasks</a>
        <a href="/pages/calendar.html">Calendar</a>
        <a href="/pages/team.html">Team</a>
        <a href="/pages/settings.html">Settings</a>
        <div class="sidebar-bottom">
            <div class="dark-mode-toggle">
                <span>Dark Mode</span>
                <span class="toggle-switch"></span>
            </div>
            <div class="upgrade-card">
                <h4>Upgrade to Pro</h4>
                <p>Unlock all features and get more from TaskFlow.</p>
                <button class="upgrade-btn">Upgrade Now</button>
            </div>
            <div class="help-support">Help & Support</div>
            <a href="/dashbaord.html" style="text-align: center;">Logout</a>
        </div>
    </aside>
    <main class="main">
        <section class="task-header">
            <div>
                <h2>Add New Task</h2>
                <p>Create and manage your tasks</p>
            </div>
        </section>
        <form id="taskForm" class="task-form">
            <input type="text" id="taskName" placeholder="Enter task name" required>
            <input type="text" id="taskDescription" placeholder="Enter task description" required>
            <select id="taskStatus">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
            <button type="submit">Add Task</button>
        </form>
        <div class="tools">
            <input type="text" id="search" placeholder="Search tasks">
            <select id="filter">
                <option value="All">All Tasks</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
        <section id="taskList" class="tasks"></section>
    </main>
    <script src="../js/tasks.js"></script>
</body>

</html>
