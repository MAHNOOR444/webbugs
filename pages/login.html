<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="login-wrapper">
            <div class="login-container">
                <div class="login-section">
                    <h2>Hello Again!</h2>
                    <p class="sub-text">Welcome back you've been missed!</p>
                    <form class="login-form" id="loginForm">
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="input-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <span class="forgot-link">Forgot your password?</span>
                        </div>
                        <button type="submit" class="btn-primary" id="signInBtn">Sign In</button>
                    </form>
                </div>
                <div class="image-section">
                    <img src="../img/mahnoor.png" alt="Landscape Illustration">
                </div>
            </div>
        </div>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
